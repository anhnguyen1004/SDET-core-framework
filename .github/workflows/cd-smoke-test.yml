name: 🚨 CD Post-Deployment Smoke Test

# ĐÁNH THỨC PIPELINE
on:
  workflow_dispatch: # Kích hoạt bằng tay (để mình test thử trước)
  repository_dispatch: 
    # Kích hoạt ngầm bằng API. Trong thực tế, Pipeline của Dev 
    # sau khi deploy xong sẽ bắn một API chứa chữ 'deploy-staging-success' 
    # vào repo của SDET để đánh thức luồng này.
    types: [deploy-success] 

jobs:
  run-smoke-test:
    runs-on: ubuntu-latest
    steps:
      - name: 🔐 Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🐳 Run Smoke Test from Docker Image
        run: |
          docker run --rm \
            -e ENV=${{ github.event.client_payload.env }} \
            -e BASE_URL=${{ github.event.client_payload.base_url }} \
            ghcr.io/${{ github.repository_owner }}/sdet-core-framework:latest \
            pytest -m smoke -v  

      - name: 🔔 Alert on Discord
        if: failure()
        run: |
          curl -H "Content-Type: application/json" -d "{
            \"embeds\": [{
              \"title\": \"🚨 ${{ github.event.client_payload.env }} DEPLOYMENT FAILED 🚨\",
              \"description\": \"Server ${{ github.event.client_payload.env }} vừa deploy lên đã tạch Smoke Test. Đề nghị kiểm tra lại log và Rollback ngay lập tức!\",
              \"color\": 16711680
            }]
          }" ${{ secrets.DISCORD_WEBHOOK_URL }}