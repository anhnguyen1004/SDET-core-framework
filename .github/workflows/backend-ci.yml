name: SDET Backend Automation CI

# Kích hoạt pipeline mỗi khi có code push lên nhánh main hoặc tạo Pull Request
on:
  push:
    branches: [ "main", "master", "cicd" ]
  pull_request:
    branches: [ "main", "master", "cicd"]

jobs:
  run-tests:
    runs-on: ubuntu-latest # Sử dụng máy chủ Ubuntu do GitHub cấp miễn phí

    steps:
    # 1. Clone code từ repo của bạn xuống máy chủ GitHub
    - name: 📥 Checkout code
      uses: actions/checkout@v4

    # 2. Bật các hệ thống vệ tinh (DB & Kafka) bằng file Docker Compose bạn đã viết
    - name: 🐳 Spin up Infrastructure (PostgreSQL & Kafka)
      run: |
        docker compose up -d
        for i in {1..45}; do
          if docker exec qa-postgres-db pg_isready -U postgres > /dev/null 2>&1; then
            echo "Spin up db is done!"
            break
          fi
          sleep 1
        done
        docker ps

    # 3. Cài đặt môi trường Python
    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip' # Cache lại thư viện để các lần chạy sau nhanh hơn

    # 4. Cài đặt các thư viện (pytest, confluent-kafka, v.v.)
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    # 5. Chạy Test và sinh dữ liệu Allure Report
    - name: Run Pytest
      run: |
        pytest tests/ --alluredir=allure-results
      env:
        # Bạn có thể ghi đè biến môi trường ở đây nếu cần thiết
        DB_HOST: localhost 
        KAFKA_BROKER: localhost:9092

    # 6. Thu thập kết quả Test (Kể cả khi Test Fail vẫn phải chạy bước này)
    - name: Upload Allure Results
      uses: actions/upload-artifact@v4
      if: always() 
      with:
        name: allure-results
        path: allure-results
        retention-days: 7