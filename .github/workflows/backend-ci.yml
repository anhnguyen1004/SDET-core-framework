name: SDET Backend Automation CI

# Kích hoạt pipeline mỗi khi có code push lên nhánh main hoặc tạo Pull Request
on:
  push:
    branches: [ "main", "master", "cicd-cache" ]
  pull_request:
    branches: [ "main", "master"]

jobs:
  run-tests:
    runs-on: ubuntu-latest # Sử dụng máy chủ Ubuntu do GitHub cấp miễn phí

    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11']

    steps:
    # Clone code từ repo của bạn xuống máy chủ GitHub
    - name: 📥 Checkout code
      uses: actions/checkout@v4

    # Caching
    - name: 🐍 Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with: 
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    # STATIC CODE ANALYSIS: Chặn mã rác trước khi chạy Test
    - name: 🧹 Linter & Code Quality (Ruff)
      run: |
        python -m pip install ruff
        ruff check .

    # Bật các hệ thống vệ tinh (DB & Kafka) bằng file Docker Compose bạn đã viết
    - name: 🐳 Spin up Infrastructure (PostgreSQL & Kafka)
      run: |
        docker compose up -d --wait
        echo "--- DB is healthy, waiting for init_schema.sql to finish... ---"
        sleep 5
        echo "--- DANH SÁCH CONTAINER ĐANG CHẠY ---"
        docker ps -a 
        echo "--- LOG CỦA POSTGRESQL ---"
        docker logs qa-postgres-db

    # Cài đặt môi trường Python
    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip' # Cache lại thư viện để các lần chạy sau nhanh hơn

    # Cài đặt các thư viện (pytest, confluent-kafka, v.v.)
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        python -m playwright install --with-deps

    # Chạy Test và sinh dữ liệu Allure Report
    - name: Run Pytest
      run: |
        pytest tests/ --alluredir=allure-results
      env:
        # Bạn có thể ghi đè biến môi trường ở đây nếu cần thiết
        KAFKA_BROKER: localhost:9092
        DB_HOST: localhost
        DB_USER: app
        DB_PASSWORD: app
        DB_NAME: app

    # Thu thập kết quả Test (Kể cả khi Test Fail vẫn phải chạy bước này)
    - name: Upload Allure Results
      uses: actions/upload-artifact@v4
      if: always() 
      with:
        name: allure-results
        path: allure-results
        retention-days: 7